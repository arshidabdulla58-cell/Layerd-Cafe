<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Layered Cafe | Menu</title>

    <link rel="stylesheet" href="menu.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!--========================
        NAVBAR
=========================-->

<header>

    <div class="logo">

                       <h2><a href="index.html">Layered Cafe</a></h2>

    </div>

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="menu.html" class="active">Menu</a></li>

            <li>

                <a href="cart.html">

                    Cart

                    <span id="cart-count">0</span>

                </a>

            </li>

            <li><a href="dashboard.html">Dashboard</a></li>

        </ul>

    </nav>

</header>

<!--========================
        HERO
=========================-->

<section class="menu-hero">

    <h1>Our Delicious Menu</h1>

    <p>Freshly prepared meals made with love.</p>

</section>

<!--========================
        SEARCH
=========================-->

<section class="search-section">

    <input
        type="text"
        id="search-input"
        placeholder="Search your favourite food...">

</section>

<!--========================
        CATEGORY
=========================-->

<section class="category-buttons">

    <button class="category-btn active" data-category="All">All</button>

    <button class="category-btn" data-category="Burger">Burger</button>

    <button class="category-btn" data-category="Pizza">Pizza</button>

    <button class="category-btn" data-category="Sandwich">Sandwich</button>

    <button class="category-btn" data-category="Fries">Fries</button>

    <button class="category-btn" data-category="Coffee">Coffee</button>

    <button class="category-btn" data-category="Shake">Shake</button>

    <button class="category-btn" data-category="Juice">Juice</button>

</section>

<!--========================
        MENU
=========================-->

<section id="menu-container" class="menu-grid">

    <!-- Products loaded by app.js -->

</section>
</section>

<!--=================================
        TOAST NOTIFICATION
==================================-->

<div id="toast">

    <i class="fa-solid fa-circle-check"></i>

    <span id="toast-message">

        Product Added Successfully

    </span>

</div>

<!--=================================
        FOOTER
==================================-->

<footer>

    <div class="footer-content">

        <div class="footer-logo">

            <i class="fa-solid fa-mug-hot"></i>

            <h2>Layered Cafe</h2>

        </div>

        <p>

            Fresh Food • Great Coffee • Happy Moments

        </p>

        <div class="footer-social">

            <a href="#"><i class="fab fa-facebook-f"></i></a>

            <a href="#"><i class="fab fa-instagram"></i></a>

            <a href="#"><i class="fab fa-twitter"></i></a>

            <a href="#"><i class="fab fa-youtube"></i></a>

        </div>

        <p class="copyright">

            © 2026 Layered Cafe. All Rights Reserved.

        </p>

    </div>

</footer>

<!--=================================
        JAVASCRIPT
==================================-->

<script src="app.js"></script>

</body>

</html>
